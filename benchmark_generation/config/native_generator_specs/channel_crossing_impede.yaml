schema_version: native_generator_spec_v1
family_name: channel_crossing_impede
generator_version: channel_crossing_impede_native_v1

benchmark_goal: >
  Generate channel-context scenes in which Rule 9 / not-to-impede / keep-to-starboard-side
  semantics are explicitly controlled rather than inferred from a generic crossing scene.

latent_variables:
  - name: channel_width_band
    type: categorical
    required: true
    values: [narrow, medium, wide]
  - name: occupancy_pattern
    type: categorical
    required: true
    values: [single_occupancy, opposing_flow, third_vessel_blocking, low_occupancy]
  - name: semantic_mode
    type: categorical
    required: true
    values: [ordinary_crossing_in_channel, keep_starboard_dominant, not_to_impede, mixed_semantics]
  - name: crossing_angle_band
    type: categorical
    required: true
    values: [small, medium, large]
  - name: ownship_channel_position
    type: categorical
    required: true
    values: [inside_center, inside_boundary, entering_from_outside, crossing_across]
  - name: effective_target_count
    type: categorical
    required: false
    values: [1, 2, 3]

soft_target_distribution:
  semantic_mode:
    ordinary_crossing_in_channel: 0.25
    keep_starboard_dominant: 0.20
    not_to_impede: 0.25
    mixed_semantics: 0.30
  channel_width_band:
    narrow: 0.40
    medium: 0.40
    wide: 0.20
  occupancy_pattern:
    single_occupancy: 0.25
    opposing_flow: 0.25
    third_vessel_blocking: 0.30
    low_occupancy: 0.20

scene_builder:
  area_context:
    area_type: narrow_channel
    channel_context: true
    tss_context: false
  channel_geometry:
    width_m:
      narrow: [120.0, 250.0]
      medium: [250.0, 450.0]
      wide: [450.0, 800.0]
    channel_heading_deg_range: [0.0, 359.0]
  ownship_position_constraints:
    inside_center:
      require_inside_channel: true
      max_offset_from_centerline_m_ratio: 0.20
    inside_boundary:
      require_inside_channel: true
      min_offset_from_centerline_m_ratio: 0.35
    entering_from_outside:
      require_start_outside_channel: true
    crossing_across:
      require_path_intersects_channel: true
  occupancy_constraints:
    single_occupancy:
      require_one_effective_target: true
    opposing_flow:
      require_targets_both_directions: true
    third_vessel_blocking:
      require_at_least_three_vessels_total: true
      require_channel_space_compression: true
    low_occupancy:
      max_effective_targets: 2
  semantic_constraints:
    ordinary_crossing_in_channel:
      require_crossing_relation: true
      require_rule9_context: true
    keep_starboard_dominant:
      require_rule9_keep_starboard_effect: true
    not_to_impede:
      require_not_to_impede_relation: true
    mixed_semantics:
      require_rule9_context: true
      require_generic_crossing_or_overtaking_overlap: true

label_consistency_checks:
  required_outputs:
    - labels.triggered_rules
    - labels.target_summaries
    - labels.explanation_steps
    - labels.maneuver_allowed
    - labels.maneuver_forbidden
  channel_checks:
    require_rule9_family: true
    require_channel_context_dependence: true
    channel_ablation_changes_labels: true
    semantic_mode_match: true

raw_candidate_schema:
  required_top_level_fields:
    - sample_id
    - pattern
    - source_mode
    - generator_version
    - candidate_seed
    - family_latent
    - scene_spec
    - inputs
    - labels
  family_latent_required_fields:
    - channel_width_band
    - occupancy_pattern
    - semantic_mode
    - crossing_angle_band
    - ownship_channel_position
  scene_spec_required_fields:
    - seed
    - area_context
    - ownship
    - targets
  area_context_required_fields:
    - area_type
    - channel_context
    - channel_width_m
    - channel_heading_deg
    - channel_centerline

rejection_conditions:
  - no_rule9_semantics
  - channel_geometry_not_causal
  - occupancy_pattern_not_realized
  - semantic_mode_not_realized
  - channel_ablation_not_affecting_interpretation
