[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "colregs-structured-reasoning"
version = "1.0.0"
description = "Public code for COLREGs-Bench structured evaluation and adaptation"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
training = [
  "torch>=2.5,<3",
  "transformers>=4.50,<5",
  "peft>=0.15,<1",
  "accelerate>=1.5,<2",
  "Pillow>=11,<13",
  "safetensors>=0.5,<1",
  "sentencepiece>=0.2,<1",
]
api = ["openai>=2,<3"]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
colreg_reasoner = ["rules/*.yaml"]
